name: Agent quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"   # weekly evals, Monday 09:00 IST

jobs:
  agent-tests:
    # Unit tests run with a fake LLM — no API keys, no cost, every push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  web-typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  agent-evals:
    # Real-LLM evals (planner accuracy, screening agreement, prompt-injection
    # resistance, counterfactual fairness). Costs a few cents, so: manual or weekly.
    # Fails the run if any metric drops below its threshold.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AGENT_MEMORY: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m evals.run_evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            agent-service/evals/report.md
            agent-service/evals/report.json
