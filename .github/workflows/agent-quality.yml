name: Agent quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"   # weekly evals, Monday 09:00 IST

jobs:
  agent-tests:
    # Unit tests run with a fake LLM — no API keys, no cost, every push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  web-typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  mcp-e2e:
    # The MCP server end to end, through the official MCP client SDK: contract
    # (tools/resources/prompts, scopes, confirmation round trip, isolation) and the
    # full OAuth 2.1 flow (discovery, DCR + CIMD, PKCE, consent, refresh rotation,
    # revocation). Real Postgres, real Next.js server, no external services, no cost.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: resume_ai_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/resume_ai_ci
      # Public URL ≠ the server's own origin (localhost), like behind Amplify's proxy: catches any
      # redirect or URL built from the request instead of the configured public URL.
      NEXTAUTH_URL: http://127.0.0.1:3100
      MCP_PUBLIC_URL: http://127.0.0.1:3100
      # Throwaway values: this server only lives for the length of the job.
      NEXTAUTH_SECRET: ci-nextauth-secret-not-used-anywhere-else
      MCP_TOKEN_SECRET: ci-mcp-token-secret-not-used-anywhere-else
      MCP_STATE_SECRET: ci-mcp-state-secret-not-used-anywhere-else
      MCP_SEND_EMAILS: "false"
      MCP_OAUTH_ALLOW_LOCAL_CIMD: "true"   # dev server only; lets the CIMD test use a localhost client id
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Seed test data
        run: node scripts/mcp-seed.mjs | tee seed.json
      - name: Start the web app
        run: |
          npx next dev --webpack -p 3100 > next.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3100/.well-known/oauth-protected-resource/api/mcp && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3100/.well-known/oauth-protected-resource/api/mcp || { tail -50 next.log; exit 1; }
          # Compile the MCP + OAuth routes once so the first test call doesn't time out on dev compilation.
          curl -s -o /dev/null -X POST http://localhost:3100/api/mcp || true
          curl -s -o /dev/null http://localhost:3100/.well-known/oauth-authorization-server || true
      - name: MCP contract tests
        run: node scripts/mcp-smoke.mjs --url http://127.0.0.1:3100/api/mcp --user "$(jq -r .user seed.json)" --other-user "$(jq -r .otherUser seed.json)"
      - name: Tool definitions match the eval snapshot
        # Tool descriptions are prompts for external LLMs; a changed tool must refresh
        # agent-service/evals/mcp_tools.json, which also triggers the eval gate (mcp_tools suite).
        run: node scripts/mcp-tools-snapshot.mjs --url http://127.0.0.1:3100/api/mcp --user "$(jq -r .user seed.json)" --check
      - name: MCP OAuth end-to-end tests
        run: node scripts/mcp-oauth-e2e.mjs --url http://127.0.0.1:3100/api/mcp --user "$(jq -r .user seed.json)"
      - name: Server log (on failure)
        if: failure()
        run: tail -150 next.log

  prompt-changes:
    # Did this PR touch anything that changes agent behaviour (prompts, models,
    # guardrails, tools, KB config, eval cases)? If so, the eval gate runs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - 'agent-service/agent/**'
              - 'agent-service/agents/**'
              - 'agent-service/core/llm.py'
              - 'agent-service/core/config.py'
              - 'agent-service/core/guardrails.py'
              - 'agent-service/core/tools.py'
              - 'agent-service/releases.json'
              - 'agent-service/evals/**'

  agent-evals:
    # Real-LLM evals (planner accuracy, screening agreement, prompt-injection
    # resistance, counterfactual fairness, FAQ grounding, coding assessment in the
    # AgentCore sandbox, feedback regressions). Every case runs 3x so a case that
    # fails only sometimes is reported as flaky instead of slipping through, and a
    # metric more than 0.05 below evals/baseline.json fails the run.
    # Gate: runs on every PR that changes prompts/models/tools/KB config (see
    # prompt-changes) and fails it if any metric drops below its threshold; also
    # weekly (catches provider-side model drift) and on demand. Costs a few cents.
    needs: [prompt-changes]
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        needs.prompt-changes.outputs.agents == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # IAM user agentcore-ci: only the three Code Interpreter session actions.
      # Without these secrets the code suite is skipped (and says so in the log).
      AWS_ACCESS_KEY_ID: ${{ secrets.AGENTCORE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AGENTCORE_AWS_SECRET_ACCESS_KEY }}
      AGENTCORE_REGION: us-east-1
      AGENT_MEMORY: memory
      # Evaluate exactly what prod would run after this merge.
      AGENT_RELEASE_ALIAS: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Check LLM keys
        # PRs from forks get no secrets; fail loudly instead of passing a gate that never ran.
        run: test -n "$OPENAI_API_KEY$GROQ_API_KEY" || { echo "::error::No LLM API key secret available — evals cannot run."; exit 1; }
      - run: python -m evals.run_evals --repeats 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            agent-service/evals/report.md
            agent-service/evals/report.json
